<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Ev. Jugend Castrop-Rauxel-Nord</title><link rel="icon" type="image/png" href="./src/favicon.png"><link rel="stylesheet" href="./src/style.css"><style>html,body{background:#f3f6f4;color:#1d2b27}@media (prefers-color-scheme:dark){html,body{background:#121917;color:#e8efec}}#boot{max-width:560px;margin:10vh auto;padding:1.2rem;font:17px/1.55 system-ui,sans-serif}#boot .e{border:2px solid #a3341f;border-radius:10px;padding:1rem;margin-top:1rem}</style>
<script>
(function(){
  function show(t,h){if(window.__shown)return;window.__shown=1;var b=document.getElementById('boot');if(b)b.innerHTML='<h1>Seite kann nicht starten</h1><div class="e"><b>'+t+'</b><br>'+h+'</div>';}
  window.__bootDone=false;
  window.addEventListener('error',function(e){if(!window.__bootDone)show('Ein Fehler ist aufgetreten.',String(e.message||'Unbekannt')+' – Prüfe, ob alle Dateien (Ordner src/) hochgeladen wurden.');});
  window.addEventListener('unhandledrejection',function(e){if(!window.__bootDone)show('Ein Fehler ist aufgetreten.',String((e.reason&&e.reason.message)||e.reason)+' – Prüfe src/config.js und die Internetverbindung.');});
  setTimeout(function(){if(!window.__bootDone&&document.getElementById('boot'))show('Die Seite lädt nicht.','Mögliche Ursache: Der Ordner <b>src/</b> fehlt im Repository.');},8000);
})();
</script></head>
<body><div id="app"><div id="boot"><p>Lade …</p></div></div><div id="toast" role="status" aria-live="polite"></div>
<script src="./src/config.js"></script><script src="./src/lib.js"></script><script src="./src/seed.js"></script><script src="./src/cms-admin.js"></script>
<script>
(async function () {
  const root = document.getElementById('app'); const me = await requireLogin(root);
  if (me.role !== 'admin') { root.innerHTML = siteHeader(me, '', './index.html') + '<main><p class="card">Dieser Bereich ist nur für Administratoren. <a href="./index.html">Zurück</a></p></main>'; document.getElementById('out').onclick = async () => { await aw.logout(); location.reload(); }; return; }
  root.innerHTML = `${siteHeader(me, 'admin', './index.html')}<main><form id="f" class="card"><h2>Neues Meeting</h2>
  <label>Titel<input name="title" required></label><label>Datum und Uhrzeit<input name="at" type="datetime-local" required></label>
  <label>Prediger<input name="preacher"></label>
  <label>Beschreibung<textarea name="desc" rows="3"></textarea></label>
  <label>Aufgaben (eine pro Zeile)<textarea name="tasks" rows="8">Begrüßung\nGebet\nBibellesung\nPredigt\nFürbitten\nTechnik\nAufbau\nAbbau</textarea></label>
  <button class="primary">Meeting speichern</button></form><div id="cms"></div></main>`;
  document.getElementById('out').onclick = async () => { await aw.logout(); location.reload(); };
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const m = await dbCreate(C_CONTENT, 'meeting', { title: f.get('title'), starts_at: new Date(f.get('at')).toISOString(), leaders: f.get('preacher') || null, description: f.get('desc') || null });
      for (const title of f.get('tasks').split('\n').map(s => s.trim()).filter(Boolean)) await dbCreate(C_TASKS, 'task', { meeting_id: m.$id, title, status: 'offen', due_date: null, assignee_id: null, assignee_name: null });
    } catch (ex) { return toast('Speichern fehlgeschlagen: ' + ex.message, true); }
    toast('Meeting gespeichert.'); e.target.reset();
  };
  initCms(document.getElementById('cms'));
})();
</script></body></html>
