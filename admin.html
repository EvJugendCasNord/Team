<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Evangelische Jugend Castrop-Rauxel-Nord</title><link rel="icon" type="image/png" href="./src/favicon.png"><link rel="stylesheet" href="./src/style.css"><style>html,body{background:#f3f6f4;color:#1d2b27}@media (prefers-color-scheme:dark){html,body{background:#121917;color:#e8efec}}#boot{max-width:560px;margin:10vh auto;padding:1.2rem;font:17px/1.55 system-ui,sans-serif}#boot .e{border:2px solid #a3341f;border-radius:10px;padding:1rem;margin-top:1rem}</style>
<script>
(function(){
  function show(t,h){if(window.__shown)return;window.__shown=1;var b=document.getElementById('boot');if(b)b.innerHTML='<h1>Seite kann nicht starten</h1><div class="e"><b>'+t+'</b><br>'+h+'</div>';}
  window.__bootDone=false;
  window.addEventListener('error',function(e){if(!window.__bootDone)show('Ein Fehler ist aufgetreten.',String(e.message||'Unbekannt')+' – Prüfe, ob alle Dateien (Ordner src/) hochgeladen wurden.');});
  window.addEventListener('unhandledrejection',function(e){if(!window.__bootDone)show('Ein Fehler ist aufgetreten.',String((e.reason&&e.reason.message)||e.reason)+' – Prüfe src/config.js und die Internetverbindung.');});
  setTimeout(function(){if(!window.__bootDone&&document.getElementById('boot'))show('Die Seite lädt nicht.','Mögliche Ursache: Der Ordner <b>src/</b> fehlt im Repository.');},8000);
})();
</script></head>
<body><div id="app"><div id="boot"><p>Lade …</p></div></div><div id="toast" role="status" aria-live="polite"></div><script>window.ADMIN_MODE = true;</script><script src="./src/config.js"></script><script src="./src/lib.js"></script><script src="./src/content.js"></script><script src="./src/seed.js"></script><script src="./src/cms-admin.js"></script><script src="./src/admin-inline.js"></script><script src="./src/app.js"></script></body></html>
